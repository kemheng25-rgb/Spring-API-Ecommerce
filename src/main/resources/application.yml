spring:
  application:
    name: demo-api

  # ---- Profiles: dev / prod ----
  profiles:
    active: dev

# ---- CORS: browser-based clients (e.g. the Nuxt frontend) call this API directly from JS ----
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3002}

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ---- Validation ----
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # ---- Kafka: order.events, published by the outbox poller, consumed per-service by group-id ----
  kafka:
    # 9094 is Kafka's host-facing listener in docker-compose (PLAINTEXT_HOST); containers on the
    # compose network use "kafka:9092" instead, set via KAFKA_BOOTSTRAP_SERVERS in the api service.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: demo-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # ---- RabbitMQ: notification.queue, published by NotificationPublisher after payment commits ----
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# ---- Swagger / OpenAPI ----
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ---- Logging ----
logging:
  level:
    com.example.ecommerce: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

---
# ---- DEV Profile ----
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:demodb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

---
# ---- PROD Profile ----
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/demodb}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
