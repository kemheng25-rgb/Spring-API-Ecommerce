services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: java-demo-api
    ports:
      # Host port changed from 8080 - an unrelated container on this machine
      # (pricing-engine-api) intermittently claims 8080 while crash-looping.
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Overridable via a local, gitignored .env file (docker-compose reads it automatically) -
      # e.g. to point at a remote Postgres instead of the local db service below.
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://db:5432/demodb}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: java-demo-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=demodb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Single-node KRaft broker (no Zookeeper needed) - order.events topic, consumed by
  # inventory-service and analytics-service as independent consumer groups.
  # Two listeners: PLAINTEXT for other containers (api talks to "kafka:9092"), PLAINTEXT_HOST
  # for processes running directly on the host (e.g. `mvn spring-boot:run` against localhost:9094).
  kafka:
    image: apache/kafka:3.7.0
    container_name: java-demo-kafka
    ports:
      - "9094:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # notification.queue - Payment publishes here (after commit) for the notification consumer.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: java-demo-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # management UI: guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
